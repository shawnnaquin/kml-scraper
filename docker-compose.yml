services:
  kml-scraper:
    build: .
    image: kml-scraper:latest
    # write dist/ as your user, not root:  export UID GID=$(id -g)
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - CONCURRENCY
      - PRECISION
      - GEOPRECISION
      - MAPS_API_KEY
      - MSADS_DEVELOPER_TOKEN
      - MSADS_ACCESS_TOKEN
      - MSADS_CUSTOMER_ID
      - MSADS_ACCOUNT_ID
      - META_ACCESS_TOKEN
      - META_GRAPH_VERSION
      - HOST=0.0.0.0
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - .:/data
      - /data/node_modules
